[project]
name = "todo"
version = "0.1.0"
description = "ToDo bot"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.12.0",
    "aiogram>=3.23.0",
    "aiogram-dialog>=2.4.0",
    "redis>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "pre-commit>=4.5.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
    "TCH",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["bot"]
combine-as-imports = true
